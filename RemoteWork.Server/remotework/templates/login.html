{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block content %}<section class="login card"><p class="eyebrow">{{ company_name }}</p><h1>원격 근무 관리</h1><p class="muted">회사 계정으로 로그인해 주세요.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('web.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="login_id">아이디</label><input id="login_id" name="login_id" required maxlength="50" autocomplete="username" autofocus>
<label for="password">비밀번호</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
<button type="submit">로그인</button></form><p class="muted footnote">계정 발급 및 비밀번호 초기화는 관리자에게 문의해 주세요.</p></section>{% endblock %}
