{% extends 'notices/layout.html' %}
{% block notices_content %}
<p class="eyebrow">WORKSPACE</p><h1>공지사항 작성</h1>
<section class="card notice-editor">
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data" data-notice-write action="{{ url_for('notice_web.create') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="title">제목</label><input id="title" name="title" maxlength="200" required value="{{ values.title or '' }}" autofocus>
<label for="audience">대상</label><select id="audience" name="target">{% for t in targets %}<option value="{{ t }}" {% if values.target == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
<label class="notice-checkbox"><input type="checkbox" name="is_pinned" value="1" {% if values.is_pinned %}checked{% endif %}> 상단 고정</label>
<label for="content">내용</label><textarea id="content" name="content" rows="12" maxlength="5000" required>{{ values.content or '' }}</textarea>
<label for="attachment_names">첨부파일명 <span class="muted">(선택)</span></label><textarea id="attachment_names" name="attachment_names" rows="3" placeholder="안내.pdf&#10;일정.xlsx">{{ values.attachment_names or '' }}</textarea>
<p class="muted">파일명만 한 줄에 하나씩 입력하세요. 최대 20개이며 업로드·다운로드는 아직 지원하지 않습니다.</p>
<div class="notice-actions"><a class="notice-button notice-neutral" href="{{ url_for('notice_web.index') }}">목록으로</a><button type="submit">공지사항 등록</button></div>
</form></section>
{% endblock %}
