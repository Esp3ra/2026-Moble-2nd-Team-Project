{% extends 'base.html' %}
{% block title %}업무 이력{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='results.css') }}"><script src="{{ url_for('static', filename='results.js') }}" defer></script>{% endblock %}
{% block content %}
<section id="results-page" class="results" data-page="history" data-role="{{ g.user.role }}" data-session="{{ page_scope }}" data-csrf="{{ csrf_token() }}">
  <span class="eyebrow">ADMINISTRATION</span><h1>업무 이력</h1>
  <p id="message" class="muted" role="status" aria-live="polite">이력을 불러오고 있습니다.</p>
  <section class="card"><form id="history-filters" class="toolbar">
    <label class="search">업무<select id="history-task"><option value="">전체 업무</option></select></label>
    <label>변경 유형<select id="history-kind"><option value="">전체 변경 유형</option><option value="created">생성</option><option value="assignee_changed">담당자 변경</option><option value="status_changed">상태 변경</option><option value="submitted">결과 제출</option><option value="approved">승인</option><option value="returned">반려</option><option value="other">기타</option></select></label>
    <button type="submit">조회</button>
  </form></section>
  <section class="card"><h2>업무 변경 이력</h2><p id="history-count" class="muted"></p>
    <div class="table-wrap"><table><thead><tr><th>선택</th><th>업무 번호</th><th>수행자</th><th>변경 시각</th><th>변경 유형</th><th>변경 내용</th></tr></thead><tbody id="history-rows"></tbody></table></div>
    <button id="history-more" type="button" class="outline" hidden>이전 이력 더 보기</button>
  </section>
  <section class="card"><h2>이력 상세</h2><div id="history-detail" class="pre">기록을 선택해 주세요.</div></section>
</section>
{% endblock %}
